# Nginx server block for co-hosting PortfolioTS alongside existing apps on a Linux VPS.
# Copy to /etc/nginx/sites-available/portfolio.conf, replace server_name with your
# domain or subdomain (e.g. portfolio.yourdomain.com), and match proxy_pass port to HOST_PORT.

server {
    listen 80;
    listen [::]:80;
    server_name thutasitt.dev www.thutasitt.dev;

    # Allow clean gzip compression for HTML/CSS/JS/JSON/SVG
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security headers — SAMEORIGIN is required so in-app PDF certificate iframes work
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Immutable Next.js build assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Hosted CV, certificates, portrait images, and SPHEREx previews
    location ~ ^/(certificates|cv|images|spherex-previews)/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # App routes, /api/status, /llms.txt, /sitemap.xml, /robots.txt
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
