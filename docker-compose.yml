services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://thutasitt.dev}
    container_name: thutasitt-portfolio
    restart: unless-stopped
    ports:
      # Bind only to loopback so Caddy/Nginx handles TLS/domain routing alongside other VPS apps
      - "127.0.0.1:${HOST_PORT:-3010}:3000"
    environment:
      PORT: "3000"
      OUT_DIR: "/app/out"
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
